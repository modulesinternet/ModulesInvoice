name: Build iOS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App (Simulator & Archive)
    runs-on: macos-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node.js Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build Optimized Web Production Bundle
        run: npm run build

      - name: Synchronize Web Assets with iOS Platform
        run: npx cap sync ios

      - name: Compile and Build iOS Simulator Runtime
        run: |
          # Use xcodebuild to build the app for the simulator without requiring private code signing keys
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Compress Simulator Build package
        run: |
          cd build/Build/Products/Debug-iphonesimulator
          zip -r ../../../../iModules-Simulator-Build.zip App.app

      - name: Publish Compiled Simulator App as Downloadable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iModules-Simulator-App-Package
          path: iModules-Simulator-Build.zip
          if-no-files-found: error
