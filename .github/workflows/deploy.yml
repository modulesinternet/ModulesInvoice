name: Continuous Integration & Deployment (CI/CD)

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout Repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Node.js Environment
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # Step 3: Install Node Dependencies
      - name: Install dependencies
        run: |
          rm -f package-lock.json
          npm install

      # Step 4: Validate and Compile Applet 
      - name: Run Linting and Type Verification
        run: npm run lint

      - name: Build Assets
        run: npm run build

      # Step 5: Authenticate with Google Cloud
      # Modern secure method: Workload Identity Federation (recommended)
      # Alternative method: Using a Service Account Secret JSON (uncomment if preferred)
      - name: Authenticate with Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          # If using service account key (uncomment if using simpler secret method):
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          # If using Workload Identity (uncomment to configure modern keyless federation):
          # workload_identity_provider: 'projects/${{ secrets.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/github-provider'
          # service_account: '${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}'

      # Step 6: Set up Cloud SDK
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # Step 7: Configure Docker integration with Artifact Registry
      - name: Configure Docker
        run: |-
          gcloud auth configure-docker ${{ secrets.GCP_REGION || 'us-central1' }}-docker.pkg.dev --quiet

      # Step 8: Build and Push Docker Container Image
      - name: Build & Push Container to Artifact Registry
        run: |-
          PROJECT_ID="${{ secrets.GCP_PROJECT_ID }}"
          if [ -z "$PROJECT_ID" ]; then
            PROJECT_ID=$(node -e "console.log(require('./firebase-applet-config.json').projectId)")
          fi
          echo "Building container for target project: $PROJECT_ID"
          IMAGE_TAG="${{ secrets.GCP_REGION || 'us-central1' }}-docker.pkg.dev/${PROJECT_ID}/${{ secrets.GCP_REGISTRY_NAME || 'cloud-run-source-deploy' }}/${{ secrets.GCP_SERVICE_NAME || 'smart-accounts' }}:${{ github.sha }}"
          docker build -t $IMAGE_TAG .
          docker push $IMAGE_TAG
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      # Step 9: Deploy Container Image to Google Cloud Run
      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ secrets.GCP_SERVICE_NAME || 'smart-accounts' }}
          region: ${{ secrets.GCP_REGION || 'us-central1' }}
          image: ${{ env.IMAGE_TAG }}
          flags: '--port=3000 --allow-unauthenticated'
          env_vars: |-
            NODE_ENV=production
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            # Add any other required environment variables here
