name: Deploy to Firebase Serverless (Hosting & Functions)

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout Repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Node.js Environment
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      # Step 3: Install Node Dependencies
      - name: Install dependencies
        run: npm ci

      # Step 4: Run Linting & Compiles Production Code
      - name: Build Application
        run: npm run build
        env:
          NODE_ENV: production

      # Step 5: Authenticate with Google Cloud using Service Account Key
      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # Step 6: Install Firebase-Tools & Deploy Serverless Resources
      - name: Deploy to Firebase (Hosting & Functions)
        run: |
          # Use npx to run the latest Firebase tools safely
          npx firebase-tools deploy --only hosting,functions --project ${{ secrets.GCP_PROJECT_ID }}
        env:
          # Expose the Gemini AI secret to the Cloud environment if needed or passed during pipeline execution
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
