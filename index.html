<!doctype html>
<html lang="en" style="background: #F1F5F9; height: 100%; margin: 0; padding: 0;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>iModules</title>
    <style>
      /* Ultra-high performance initial loader to completely eliminate startup white flashes */
      html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        background: linear-gradient(135deg, #F1F5F9 0%, #F8FAFC 50%, #EFF2F8 100%) !important;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
      }
      
      .initial-splash-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        height: 100%;
        width: 100%;
        box-sizing: border-box;
        padding: 48px 24px;
        position: relative;
        z-index: 10;
      }

      /* Ambient pulsing light source */
      .glowing-orb {
        position: absolute;
        top: 33%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 500px;
        height: 500px;
        background: radial-gradient(circle, rgba(91, 33, 255, 0.04) 0%, rgba(91, 33, 255, 0) 70%);
        border-radius: 50%;
        pointer-events: none;
        animation: pulseglow 3.5s infinite ease-in-out;
        z-index: 1;
      }

      @keyframes pulseglow {
        0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; }
        50% { transform: translate(-50%, -50%) scale(1.1); opacity: 0.9; }
      }

      .splash-header {
        text-align: center;
        z-index: 2;
        margin-top: 12px;
        animation: fadein 0.6s ease-out;
      }

      .secured-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: #ffffff;
        border: 1px solid rgba(229, 231, 235, 0.8);
        border-radius: 9999px;
        padding: 4px 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
      }

      .secured-dot {
        width: 6px;
        height: 6px;
        background-color: #10b981;
        border-radius: 50%;
        animation: blink 1.5s infinite;
      }

      @keyframes blink {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }

      .splash-subtitle {
        font-size: 9px;
        font-weight: bold;
        letter-spacing: 0.15em;
        color: #64748B;
        text-transform: uppercase;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }

      .logo-wrapper {
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 2;
        flex: 1;
      }

      .logo-concentric-container {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 220px;
        height: 220px;
      }

      /* Halo ring matching the SVG loader path */
      .static-halo {
        position: absolute;
        width: 188px;
        height: 188px;
        border-radius: 50%;
        border: 4px solid rgba(241, 245, 249, 0.9);
        box-shadow: 0 0 20px rgba(91, 33, 255, 0.01);
      }

      .spinning-progress-accent {
        position: absolute;
        width: 188px;
        height: 188px;
        border-radius: 50%;
        border: 4px solid transparent;
        border-top-color: #5B21FF;
        animation: spin 2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        box-shadow: 0 0 4px rgba(91, 33, 255, 0.05);
      }

      .logo-card {
        width: 144px;
        height: 144px;
        background: #ffffff;
        border-radius: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 16px 40px rgba(91, 33, 255, 0.06), 0 8px 16px rgba(0, 0, 0, 0.02);
        border: 1px solid rgba(255, 255, 255, 0.95);
        position: absolute;
        animation: floatcard 5s ease-in-out infinite;
      }

      @keyframes floatcard {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
      }

      .logo-card::before {
        content: '';
        position: absolute;
        inset: 6px;
        border-radius: 28px;
        border: 1px solid #f8fafc;
        pointer-events: none;
      }

      .fallback-logo-icon {
        width: 60px;
        height: 60px;
        border-radius: 16px;
        background: linear-gradient(135deg, #5B21FF 0%, #8F66FF 100%);
        box-shadow: 0 8px 24px rgba(91, 33, 255, 0.15);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        color: white;
        font-weight: 800;
        letter-spacing: -0.05em;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
      }

      .progress-container {
        width: 100%;
        max-width: 220px;
        display: flex;
        flex-direction: column;
        align-items: center;
        z-index: 2;
        gap: 16px;
        animation: fadein 0.8s ease-out;
      }

      @keyframes fadein {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .status-label {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 18px;
      }

      .status-text {
        font-size: 10px;
        font-weight: bold;
        color: #64748B;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }

      .tiny-spinner {
        width: 12px;
        height: 12px;
        border: 2px solid rgba(91, 33, 255, 0.15);
        border-top-color: #5B21FF;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="initial-splash-container">
        <div class="glowing-orb"></div>
        <div class="splash-header">
          <div class="secured-pill">
            <div class="secured-dot"></div>
            <div class="splash-subtitle">Secured Endpoint</div>
          </div>
        </div>
        <div class="logo-wrapper">
          <div class="logo-concentric-container">
            <div class="static-halo"></div>
            <div class="spinning-progress-accent"></div>
            <div class="logo-card" id="static-logo-card">
              <div class="fallback-logo-icon" id="static-logo-text">iM</div>
            </div>
          </div>
        </div>
        <div class="progress-container">
          <div class="status-label">
            <div class="tiny-spinner"></div>
            <div class="status-text" id="static-status-text">Initializing...</div>
          </div>
        </div>
      </div>
    </div>
    <script>
      (function() {
        try {
          var cachedSettings = localStorage.getItem('db_settings');
          if (cachedSettings) {
            var settings = JSON.parse(cachedSettings);
            if (settings) {
              if (settings.logoUrl && settings.logoUrl.trim()) {
                var card = document.getElementById('static-logo-card');
                if (card) {
                  card.innerHTML = '<img src="' + settings.logoUrl.trim() + '" style="width: 100%; height: 100%; object-fit: contain; border-radius: 28px;" alt="Logo" referrerPolicy="no-referrer" />';
                }
              } else if (settings.companyName && settings.companyName.trim()) {
                var logoTxt = document.getElementById('static-logo-text');
                if (logoTxt) {
                  logoTxt.textContent = settings.companyName.trim().substring(0, 2).toUpperCase();
                }
              }
            }
          }
        } catch(e) {
          console.warn('Error hydrating static splash:', e);
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
